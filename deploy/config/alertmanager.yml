route:
  receiver: nexora
  group_by: ["alertname", "service", "environment"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: nexora
    webhook_configs:
      # Nexora's alert gateway (built in Step 2). Until then deliveries fail; that is expected.
      - url: http://host.docker.internal:8000/api/v1/integrations/alerts/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook_token
