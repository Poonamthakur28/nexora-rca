# Nexora service catalog (local). Links each monitored service to its source code, owners,
# telemetry, the metric queries Nexora uses as evidence, and the mitigation actions it may run.
#
# Metric queries are PromQL; {service} is replaced with telemetry_service_name.
# Leave `metrics` out to use the OpenTelemetry HTTP defaults
# (http_server_request_duration_seconds_*), which most instrumented services emit.
services:
  - name: shop-demo
    environment: local
    owners: [team4]
    # shop-demo is not its own repository: it lives in the shop-demo/ folder of this one.
    repository_url: https://github.com/Poonamthakur28/nexora-rca
    language: python
    # Nexora reads source from here (mounted read-only into the Nexora containers).
    source_root: /repos/shop-demo
    # Path prefix of the code inside the running container; stack frames under it are app code.
    runtime_path_prefix: /srv/
    telemetry_service_name: shop-demo
    dependencies: [payment-gateway]
    actions:
      - type: rollback_release
        title: Roll back to the previous healthy release
        risk: low
        approval: single
        params: {}
        preconditions:
          - previous_release_exists
          - previous_release_healthy
          - no_irreversible_migration
          - no_execution_running
      - type: disable_feature
        title: Disable a planted failure flag
        risk: low
        approval: single
        params:
          flag: null
        preconditions:
          - flag_exists
          - no_execution_running
      - type: restart_service
        title: Restart the service connection pool
        risk: medium
        approval: single
        params: {}
        preconditions:
          - no_execution_running
          - restart_rate_limit
    metrics:
      error_ratio:
        title: 5xx error ratio
        threshold: 0.05
      latency_p95:
        title: p95 checkout latency
        query: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="{service}", http_route="/checkout"}[1m])))
        threshold: 1.0
      saturation:
        - name: db_pool_utilization
          title: Database connection pool use
          query: max(shop_db_pool_in_use{service_name="{service}"}) / max(shop_db_pool_size{service_name="{service}"})
          unit: ratio
          threshold: 0.9
    baseline_deployment:
      version: v1.0.0
      commit_sha: baseline
      description: Initial release of shop-demo.
