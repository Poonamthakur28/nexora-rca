groups:
  - name: shop-demo
    rules:
      - alert: ShopDemoHighErrorRate
        expr: |
          (
            sum(rate(shop_http_requests_total{service_name="shop-demo", status_code=~"5.."}[1m]))
            /
            sum(rate(shop_http_requests_total{service_name="shop-demo"}[1m]))
          ) > 0.05
        for: 1m
        labels:
          severity: critical
          service: shop-demo
          environment: local
        annotations:
          summary: "shop-demo 5xx error rate above 5%"
          description: "More than 5% of shop-demo requests returned HTTP 5xx over the last minute."

      - alert: ShopDemoDown
        expr: up{job="shop-demo"} == 0
        for: 1m
        labels:
          severity: critical
          service: shop-demo
          environment: local
        annotations:
          summary: "shop-demo is not responding"
          description: "Prometheus cannot reach the shop-demo health endpoint."

      - alert: ShopDemoHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_request_duration_seconds_bucket{service_name="shop-demo", http_route="/checkout"}[1m]))
          ) > 1
        for: 1m
        labels:
          severity: warning
          service: shop-demo
          environment: local
        annotations:
          summary: "shop-demo checkout p95 latency above 1 s"
          description: "95% of checkout requests should finish within 1 second."

      - alert: ShopDemoDbPoolSaturated
        expr: |
          max(shop_db_pool_in_use{service_name="shop-demo"})
          / max(shop_db_pool_size{service_name="shop-demo"}) >= 0.9
        for: 1m
        labels:
          severity: critical
          service: shop-demo
          environment: local
        annotations:
          summary: "shop-demo database connection pool almost exhausted"
          description: "90% or more of shop-demo's database connections are in use."
