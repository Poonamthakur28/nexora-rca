global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application metrics pushed by shop-demo via OTLP, exposed by the collector.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Liveness of shop-demo itself (ShopDemoDown alert).
  - job_name: shop-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["shop-demo:8080"]
