# Local-dev Prometheus for Nexora RCA: evaluates the alert rules and sends them to Nexora's
# Alertmanager. Used only with docker-compose.local.yml, when port 9090 and the OTel collector
# belong to another stack (Team 4) on the same machine.
#
# It does not receive telemetry itself: it federates shop-demo's series read-only from the
# Prometheus on the host (127.0.0.1:9090) and scrapes shop-demo's liveness endpoint (18080).
# Rules are the same, unchanged files as the Docker stack (deploy/config/rules/*.yml).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Read-only pull of shop-demo / payment-gateway series from the host Prometheus.
  - job_name: team4-federate
    honor_labels: true
    metrics_path: /federate
    params:
      "match[]":
        - '{service_name=~"shop-demo|payment-gateway"}'
    static_configs:
      - targets: ["host.docker.internal:9090"]

  # Liveness of shop-demo itself (ShopDemoDown alert: up{job="shop-demo"}).
  - job_name: shop-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18080"]
