server:
  http_listen_port: 3200

distributor:
  # Default is 2 KB, which cuts Python stack traces before the faulty frame.
  max_attribute_bytes: 65536
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 24h
